<div class="container-fluid py-4 bg-light min-vh-100">
  
  <div class="header-section d-flex justify-content-between align-items-center mb-4" *ngIf="!isFormVisible">
    <h2 class="fw-bold text-dark m-0" style="font-size: 24px;">Product Management</h2>

    <div class="d-flex align-items-center gap-2">
      <div class="search-wrapper" style="width: 280px;">
        <div class="input-group shadow-sm border rounded-3 overflow-hidden bg-white">
          <span class="input-group-text bg-white border-0">
            <i class="fas fa-search text-muted"></i>
          </span>
          <input type="text" [(ngModel)]="searchText" (ngModelChange)="p=1" 
                 class="form-control border-0 ps-0 shadow-none" placeholder="Search product or barcode..">
        </div>
      </div>

      <button (click)="openForm()" class="btn btn-primary d-flex align-items-center gap-2 px-4 py-2 shadow-sm" 
              style="background-color: #4361ee; border: none; border-radius: 8px; font-weight: 600; height: 40px;">
        <i class="fas fa-plus"></i> Add Product
      </button>
    </div>
  </div>

  <div class="card border-0 shadow-sm" *ngIf="!isFormVisible" style="border-radius: 12px; overflow: hidden;">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead style="background-color: #f8fafc;">
          <tr>
            <th (click)="toggleSort('id')" class="p-3 text-secondary small fw-bold cursor-pointer">ID <i class="fas fa-sort ms-1"></i></th>
            <th (click)="toggleSort('name')" class="p-3 text-secondary small fw-bold cursor-pointer">NAME <i class="fas fa-sort ms-1"></i></th>
            <th class="p-3 text-secondary small fw-bold">CATEGORY</th>
            <th class="p-3 text-secondary small fw-bold">PRICE</th>
            <th class="p-3 text-secondary small fw-bold">STOCK</th>
            <th class="p-3 text-secondary small fw-bold">UNIT</th>
            <th class="p-3 text-secondary small fw-bold text-end pe-4">ACTIONS</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let p of filteredProducts | paginate: { itemsPerPage: pageSize, currentPage: p }">
            <td class="p-3 text-muted small">#{{p.id}}</td>
            <td class="p-3">
              <div class="fw-bold text-dark">{{p.name}}</div>
              <small class="text-muted" style="font-size: 11px;">{{p.barcode}}</small>
            </td>
            <td class="p-3">
              <span class="badge bg-light text-dark border px-2 py-1" style="border-radius: 6px; font-weight: 500;">
                {{p.itemCategoryName}}
              </span>
            </td>
            <td class="p-3 fw-bold text-primary">${{p.price}}</td>
            <td class="p-3">{{p.currentStock}}</td>
            <td class="p-3">{{p.unitName}}</td>
            <td class="p-3 text-end pe-4">
              <button (click)="onEdit(p)" class="btn btn-sm text-dark px-3 me-2 border-0 fw-bold" style="background-color: #ffb703; border-radius: 6px;">
                <i class="fas fa-edit me-1"></i> Edit
              </button>
              <button (click)="onDelete(p.id)" class="btn btn-sm text-white px-3 border-0 fw-bold" style="background-color: #ef233c; border-radius: 6px;">
                <i class="fas fa-trash me-1"></i> Delete
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="card-footer bg-white border-0 p-3 d-flex justify-content-between align-items-center">
      <small class="text-muted">
        Showing <strong>{{ startIndex }}</strong> to <strong>{{ endIndex }}</strong> of <strong>{{ totalCount }}</strong> results
      </small>
      <div class="d-flex align-items-center gap-2">
        <select [(ngModel)]="pageSize" (change)="p = 1" class="form-select form-select-sm" style="width: auto;">
          <option [value]="5">5 / page</option>
          <option [value]="10">10 / page</option>
          <option [value]="15">15 / page</option>
          <option [value]="20">20 / page</option>
        </select>
        <pagination-controls (pageChange)="p = $event"></pagination-controls>
      </div>
    </div>
  </div>

  <div class="card border-0 shadow-sm" *ngIf="isFormVisible" style="border-radius: 12px;">
    <div class="card-body p-4">
      <h3 class="fw-bold mb-4" style="color: #1e293b;">{{ isEditMode ? 'Edit' : 'Create' }} Product</h3>
      
      <form (ngSubmit)="onSubmit()" #productForm="ngForm">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-bold small text-secondary">Product Name *</label>
            <input type="text" [(ngModel)]="currentProduct.name" name="name" class="form-control py-2 shadow-none" required style="border-radius: 8px; border: 1px solid #cbd5e1;">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold small text-secondary">Barcode *</label>
            <input type="text" [(ngModel)]="currentProduct.barcode" name="barcode" class="form-control py-2 shadow-none" required style="border-radius: 8px; border: 1px solid #cbd5e1;">
          </div>

          <div class="col-md-3">
            <label class="form-label fw-bold small text-secondary">Category *</label>
            <select [(ngModel)]="currentProduct.itemCategoryId" name="cat" class="form-select py-2 shadow-none" 
                    (change)="onItemCategoryChange()" required style="border-radius: 8px; border: 1px solid #cbd5e1;">
              <option value="">-- Select --</option>
              <option *ngFor="let c of itemCategories" [value]="c.itemCategoryId">{{c.categoryName}}</option>
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label fw-bold small text-secondary">Sub Category *</label>
            <select [(ngModel)]="currentProduct.subCategoryId" name="sub" class="form-select py-2 shadow-none" required style="border-radius: 8px; border: 1px solid #cbd5e1;">
              <option value="">-- Select --</option>
              <option *ngFor="let s of filteredSubCategories" [value]="s.subCategoryId">{{s.subCategoryName}}</option>
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label fw-bold small text-secondary">Brand *</label>
            <select [(ngModel)]="currentProduct.brandId" name="brand" class="form-select py-2 shadow-none" required style="border-radius: 8px; border: 1px solid #cbd5e1;">
              <option value="">-- Select --</option>
              <option *ngFor="let b of brands" [value]="b.brandId">{{b.brandName}}</option>
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label fw-bold small text-secondary">Unit *</label>
            <select [(ngModel)]="currentProduct.unitId" name="unit" class="form-select py-2 shadow-none" required style="border-radius: 8px; border: 1px solid #cbd5e1;">
              <option value="">-- Select --</option>
              <option *ngFor="let u of units" [value]="u.unitId">{{u.nameOfUnit}}</option>
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label fw-bold small text-secondary">Price *</label>
            <input type="number" [(ngModel)]="currentProduct.price" name="price" class="form-control py-2 shadow-none" required style="border-radius: 8px; border: 1px solid #cbd5e1;">
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold small text-secondary">Opening Stock *</label>
            <input type="number" [(ngModel)]="currentProduct.currentStock" name="stock" class="form-control py-2 shadow-none" required style="border-radius: 8px; border: 1px solid #cbd5e1;">
          </div>

          <div class="col-md-4 d-flex align-items-center mt-5">
            <div class="form-check">
              <input type="checkbox" [(ngModel)]="currentProduct.isPerishable" name="perish" id="perish" class="form-check-input shadow-none">
              <label for="perish" class="form-check-label ms-1 fw-bold small text-secondary"> Is Perishable?</label>
            </div>
          </div>
        </div>

        <div class="mt-4 pt-3 border-top d-flex gap-2">
          <button type="submit" class="btn btn-success px-4 fw-bold" [disabled]="productForm.invalid" style="border-radius: 8px; background-color: #10b981; border: none;">
            Save Product
          </button>
          <button type="button" (click)="closeForm()" class="btn btn-light border px-4 fw-bold" style="border-radius: 8px;">
            Cancel
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
