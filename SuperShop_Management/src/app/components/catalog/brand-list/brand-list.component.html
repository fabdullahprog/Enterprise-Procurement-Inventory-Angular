<div class="container">
  <div class="header d-flex justify-content-between align-items-center mb-4" *ngIf="!isFormVisible">
    <h2>Brand Management</h2>
    <div class="d-flex gap-2">
      <input type="text" [(ngModel)]="searchText" (ngModelChange)="p=1" class="form-control w-auto" placeholder="Search brands...">
      <button (click)="openForm()" class="btn-add">
        <i class="fas fa-plus"></i> Add Brand
      </button>
    </div>
  </div>

  <div class="card shadow mb-4" *ngIf="isFormVisible">
    <div class="card-header">
      <h3 class="mb-0">{{ isEditMode ? 'Edit' : 'Create' }} Brand</h3>
    </div>
    <div class="card-body">
      <form (ngSubmit)="onSubmit()" #brandForm="ngForm">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Brand Name *</label>
            <input type="text" [(ngModel)]="currentBrand.brandName" name="name" class="form-control" required #bName="ngModel" placeholder="Brand Name">
            <div *ngIf="bName.invalid && (bName.dirty || bName.touched)" class="text-danger small mt-1">Required field.</div>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Sub-Category *</label>
            <select [(ngModel)]="currentBrand.subCategoryId" name="sub" class="form-control" required>
              <option [value]="0" disabled>-- Select --</option>
              <option *ngFor="let sc of subCategories" [value]="sc.subCategoryId">{{sc.subCategoryName}}</option>
            </select>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Country</label>
            <input type="text" [(ngModel)]="currentBrand.country" name="country" class="form-control" placeholder="Country">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Website</label>
            <input type="text" [(ngModel)]="currentBrand.website" name="web" class="form-control" placeholder="Website URL">
          </div>
        </div>

        <div class="button-group mt-3 border-top pt-3">
          <button type="submit" class="btn-save" [disabled]="brandForm.invalid || currentBrand.subCategoryId === 0">
            <i class="fas fa-save"></i> Save Brand
          </button>
          <button type="button" (click)="closeForm()" class="btn-cancel">
            <i class="fas fa-times"></i> Cancel
          </button>
        </div>
      </form>
    </div>
  </div>

  <div class="card shadow-sm" *ngIf="!isFormVisible">
    <div class="table-responsive">
      <table class="table mb-0">
        <thead>
          <tr>
            <th (click)="sort('brandId')" style="cursor:pointer">ID <i class="fas fa-sort ms-1"></i></th>
            <th (click)="sort('brandName')" style="cursor:pointer">NAME <i class="fas fa-sort ms-1"></i></th>
            <th>COUNTRY</th>
            <th>STATUS</th>
            <th class="text-center">ACTIONS</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of filteredBrands | paginate: { itemsPerPage: pageSize, currentPage: p }">
            <td>#{{ item.brandId }}</td>
            <td><strong>{{ item.brandName }}</strong></td>
            <td>{{ item.country || 'N/A' }}</td>
            <td><span [ngClass]="item.isActive ? 'status-active' : 'status-inactive'">{{ item.isActive ? 'Active' : 'Inactive' }}</span></td>
            <td class="action-buttons">
              <button (click)="onEdit(item.brandId)" class="btn-edit"><i class="fas fa-edit"></i> Edit</button>
              <button (click)="onDelete(item.brandId)" class="btn-delete"><i class="fas fa-trash"></i> Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="p-3 d-flex justify-content-between align-items-center border-top">
      <small class="text-muted">
        Showing <strong>{{ startIndex }}</strong> to <strong>{{ endIndex }}</strong> of <strong>{{ totalCount }}</strong> results
      </small>
      <div class="d-flex align-items-center gap-2">
        <select [(ngModel)]="pageSize" (change)="p = 1" class="form-select form-select-sm" style="width: auto;">
          <option [value]="5">5 / page</option>
          <option [value]="10">10 / page</option>
          <option [value]="15">15 / page</option>
          <option [value]="20">20 / page</option>
        </select>
        <pagination-controls (pageChange)="p = $event"></pagination-controls>
      </div>
    </div>
  </div>
</div>
